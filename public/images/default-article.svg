<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B5645;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative pattern -->
  <g opacity="0.1">
    <circle cx="200" cy="150" r="120" fill="#D4AF37"/>
    <circle cx="1000" cy="480" r="100" fill="#D4AF37"/>
    <circle cx="600" cy="100" r="80" fill="#D4AF37"/>
  </g>
  
  <!-- Content box -->
  <rect x="150" y="180" width="900" height="270" rx="20" fill="url(#accentGradient)"/>
  <rect x="150" y="180" width="900" height="270" rx="20" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.5"/>
  
  <!-- Icon -->
  <g transform="translate(550, 250)">
    <!-- Document icon -->
    <path d="M 0,0 L 60,0 L 60,10 L 70,20 L 70,90 L 0,90 Z" fill="#D4AF37" opacity="0.6"/>
    <path d="M 60,0 L 60,20 L 70,20" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.6"/>
    <line x1="15" y1="30" x2="55" y2="30" stroke="#8B7355" stroke-width="3" opacity="0.8"/>
    <line x1="15" y1="45" x2="55" y2="45" stroke="#8B7355" stroke-width="3" opacity="0.8"/>
    <line x1="15" y1="60" x2="40" y2="60" stroke="#8B7355" stroke-width="3" opacity="0.8"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    IndoQuran
  </text>
  <text x="600" y="435" font-family="Arial, sans-serif" font-size="20" fill="#D4AF37" text-anchor="middle">
    Artikel Default
  </text>
  
  <!-- Bottom decoration -->
  <rect x="400" y="560" width="400" height="3" rx="1.5" fill="#D4AF37" opacity="0.5"/>
</svg>
